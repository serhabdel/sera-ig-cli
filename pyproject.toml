[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sera-ig-cli"
version = "0.1.0"
description = "Instagram in your terminal — a private-API Instagram client built on instagrapi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seradyx Lab", email = "hello@seradyx.tech" }]
keywords = [
    "instagram",
    "cli",
    "terminal",
    "tui",
    "instagrapi",
    "private-api",
    "dm",
    "direct-messages",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "instagrapi>=3.0.26",
    "typer>=0.12.5",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "emoji>=2.14.0",
    "art>=6.1",
    "requests>=2.31.0",
    "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
video = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.25",
    "proglog<=1.0.0",
    "decorator<6.0,>=4.0.2",
    "python-dotenv>=0.10",
]

[project.urls]
Homepage = "https://seradyx.tech"
Repository = "https://github.com/serhabdel/sera-ig-cli"
Issues = "https://github.com/serhabdel/sera-ig-cli/issues"

[project.scripts]
seraig = "sera_ig.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sera_ig*"]

[tool.setuptools.package-data]
"sera_ig" = ["*.md", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
